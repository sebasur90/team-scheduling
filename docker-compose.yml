version: '3.8'

services:
  firebase-emulator:
    build:
      context: .
      dockerfile: Dockerfile.firebase
    environment:
      - FIREBASE_EMULATOR_FIRESTORE_HOST=0.0.0.0:8080
    ports:
      - "3002:8080"
      - "4000:4000"
    volumes:
      - ./firebase.json:/firebase/firebase.json
      - ./firestore.rules:/firebase/firestore.rules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    image: organizacion:backend
    depends_on:
      firebase-emulator:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    ports:
      - "3001:8000"
    volumes:
      - ./backend:/app
      - ./almuerzos.db:/app/almuerzos.db
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    image: organizacion:frontend
    depends_on:
      - backend
      - firebase-emulator
    env_file:
      - ./frontend/.env.docker
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api
