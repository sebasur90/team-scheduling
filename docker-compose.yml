version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: almuerzos_user
      POSTGRES_PASSWORD: almuerzos_password
      POSTGRES_DB: almuerzos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almuerzos_user -d almuerzos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  firebase-emulator:
    image: node:18
    working_dir: /firebase
    command: sh -c "apt-get update && apt-get install -y openjdk-17-jre-headless curl && npm install -g firebase-tools && firebase emulators:start --only firestore"
    environment:
      - FIREBASE_EMULATOR_FIRESTORE_HOST=0.0.0.0:8080
    ports:
      - "3002:8080"
      - "4000:4000"
    volumes:
      - ./firebase.json:/firebase/firebase.json
      - ./firestore.rules:/firebase/firestore.rules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    image: organizacion:backend
    depends_on:
      postgres:
        condition: service_healthy
      firebase-emulator:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    ports:
      - "3001:8000"
    volumes:
      - ./backend:/app
    environment:
      - NO_PROXY=localhost,127.0.0.1,firebase-emulator,postgres
      - no_proxy=localhost,127.0.0.1,firebase-emulator,postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    image: organizacion:frontend
    depends_on:
      - backend
      - firebase-emulator
    env_file:
      - ./frontend/.env.docker
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api
      - VITE_FIRESTORE_EMULATOR_HOST=smoa7001lx:3002
      - NO_PROXY=localhost,127.0.0.1,firebase-emulator,backend,postgres
      - no_proxy=localhost,127.0.0.1,firebase-emulator,backend,postgres

volumes:
  postgres_data:
